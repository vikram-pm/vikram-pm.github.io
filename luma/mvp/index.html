<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Luma · Live demo</title>
<meta name="description" content="Talk to Luma, a voice-first family companion by Vikram Seenivasan.">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 90% at 50% 0%,#2A2F5C 0%,#14162B 55%,#0B0C18 100%);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;overflow:hidden}
.stage{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px}
.phone{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;background:#2E3260;box-shadow:0 0 0 10px #14161F,0 40px 120px -30px rgba(0,0,0,.8);transform:scale(var(--fit,1));transform-origin:center center;flex:none}
@media (max-width:600px){.stage{padding:0}.phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none;transform:none}}
.scene,.charwrap{position:absolute;inset:0;width:100%;height:100%}
.charwrap{transition:transform .45s ease;transform-origin:50% 60%}
.ex{display:none}
.phone[data-mood="idle"] .ex-idle,.phone[data-mood="listening"] .ex-listening,.phone[data-mood="thinking"] .ex-thinking,.phone[data-mood="speaking"] .ex-speaking,.phone[data-mood="approval"] .ex-approval,.phone[data-mood="happy"] .ex-happy{display:inline}
@media (prefers-reduced-motion:no-preference){
 .body{animation:breathe 4s ease-in-out infinite;transform-origin:195px 652px}
 .orb{animation:pulse 2.4s ease-in-out infinite}
 .phone[data-mood="listening"] .orb{animation-duration:.9s}
 .phone[data-mood="thinking"] .orb{animation-duration:1.4s}
 .blink{animation:blink 5s infinite;transform-origin:195px 555px}
 .talk{animation:talk .28s ease-in-out infinite alternate;transform-origin:195px 588px}
 .think-dots circle{animation:dot 1.2s infinite} .think-dots circle:nth-child(2){animation-delay:.2s} .think-dots circle:nth-child(3){animation-delay:.4s}
 .arc{animation:arc 1.2s ease-in-out infinite}
}
@keyframes breathe{50%{transform:translateY(-4px) scaleY(1.015)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.15)}}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes arc{50%{opacity:.25}}
/* progress orbs: one per task of the current goal, filled when done */
.orbs{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:3;transition:opacity .3s}
.orbs:empty{opacity:0}
.orbs i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,212,138,.75);background:transparent;transition:background .4s,transform .4s}
.orbs i.done{background:#FFD48A;border-color:#FFD48A;box-shadow:0 0 12px rgba(255,212,138,.7)}
.orbs i.pending{border-style:dashed;opacity:.8;animation:pulse 1.6s ease-in-out infinite}
/* mic */
.bar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 46px);display:flex;justify-content:center;z-index:3}
.mic{position:relative;width:84px;height:84px;border-radius:50%;border:0;background:#F5B84B;color:#1B1730;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s,background .2s;box-shadow:0 10px 30px -8px rgba(245,184,75,.6)}
.mic:active{transform:scale(.96)}
.mic:focus-visible{outline:3px solid #fff;outline-offset:4px}
.mic::before,.mic::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(245,184,75,.0);pointer-events:none}
.phone[data-mood="idle"] .mic::before{animation:invite 2.6s ease-out infinite}
.phone[data-mood="listening"] .mic::before{animation:ring 1s ease-out infinite}
.phone[data-mood="listening"] .mic::after{animation:ring 1s ease-out .5s infinite}
.phone[data-mood="thinking"] .mic{background:#C9B48F}
.phone[data-mood="speaking"] .mic{background:#fff}
.phone[data-mood="approval"] .mic::before{animation:ring 1.4s ease-out infinite}
.mic svg{width:34px;height:34px}
.mic .ic-wave{display:none}
.phone[data-mood="speaking"] .mic .ic-mic{display:none}
.phone[data-mood="speaking"] .mic .ic-wave{display:block}
@keyframes ring{0%{border-color:rgba(245,184,75,.7);transform:scale(.9)}100%{border-color:rgba(245,184,75,0);transform:scale(1.45)}}
@keyframes invite{0%{border-color:rgba(245,184,75,.45);transform:scale(.95)}70%,100%{border-color:rgba(245,184,75,0);transform:scale(1.3)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.mic::before,.mic::after,.orbs i.pending{animation:none!important}}
</style>
</head>
<body>
<div class="stage">
<div class="phone" id="phone" data-mood="idle">
<svg class="scene" viewBox="0 0 390 844" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs><radialGradient id="lg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD48A" stop-opacity=".42"/><stop offset="1" stop-color="#FFD48A" stop-opacity="0"/></radialGradient></defs>
    <rect x="0" y="-400" width="390" height="1020" fill="#2E3260"/><rect x="0" y="620" width="390" height="400" fill="#3B3657"/>
    <ellipse cx="195" cy="700" rx="178" ry="50" fill="#4C4677"/><ellipse cx="195" cy="700" rx="150" ry="38" fill="none" stroke="#5D5790" stroke-width="2"/>
    <path d="M80 400 L80 220 A115 115 0 0 1 310 220 L310 400 Z" fill="#1C2150"/>
    <g fill="#FFF6D6"><circle cx="118" cy="180" r="1.6"/><circle cx="150" cy="140" r="1.2"/><circle cx="170" cy="230" r="1.4"/><circle cx="222" cy="150" r="1.1"/><circle cx="290" cy="250" r="1.5"/><circle cx="130" cy="300" r="1.1"/><circle cx="260" cy="320" r="1.3"/><circle cx="285" cy="140" r="1.2"/></g>
    <circle cx="255" cy="190" r="24" fill="#FFE8A8"/><circle cx="266" cy="181" r="20" fill="#1C2150"/>
    <path d="M80 400 L80 220 A115 115 0 0 1 310 220 L310 400 Z" fill="none" stroke="#E9D9C0" stroke-width="8"/>
    <line x1="195" y1="106" x2="195" y2="400" stroke="#E9D9C0" stroke-width="5"/><line x1="80" y1="285" x2="310" y2="285" stroke="#E9D9C0" stroke-width="5"/>
    <rect x="64" y="398" width="262" height="12" rx="3" fill="#E9D9C0"/>
    <circle cx="335" cy="345" r="190" fill="url(#lg)"/>
    <ellipse cx="335" cy="640" rx="24" ry="6" fill="#C9B48F"/><line x1="335" y1="640" x2="335" y2="360" stroke="#C9B48F" stroke-width="4"/><path d="M300 362 L370 362 L356 310 L314 310 Z" fill="#F6D9A0"/>
    <ellipse cx="44" cy="520" rx="14" ry="36" fill="#5E9C78" transform="rotate(-25 44 520)"/><ellipse cx="62" cy="510" rx="13" ry="40" fill="#4C8566" transform="rotate(12 62 510)"/><ellipse cx="30" cy="545" rx="12" ry="28" fill="#4C8566" transform="rotate(-50 30 545)"/><path d="M22 560 L82 560 L74 630 L30 630 Z" fill="#C77B58"/>
  </svg>
<svg class="charwrap" id="luma" viewBox="0 0 390 844" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Luma">
    <ellipse cx="195" cy="662" rx="80" ry="12" fill="#000" opacity=".25"/>
    <line x1="195" y1="472" x2="195" y2="452" stroke="#E9D3B4" stroke-width="3" stroke-linecap="round"/>
    <circle class="orb" cx="195" cy="444" r="22" fill="#FFD48A" opacity=".45"/><circle cx="195" cy="444" r="9" fill="#FFD48A"/>
    <g class="body">
      <ellipse cx="117" cy="592" rx="12" ry="21" fill="#EADBC2" transform="rotate(-18 117 592)"/><ellipse cx="273" cy="592" rx="12" ry="21" fill="#EADBC2" transform="rotate(18 273 592)"/>
      <ellipse cx="170" cy="652" rx="19" ry="9" fill="#E3CCAA"/><ellipse cx="220" cy="652" rx="19" ry="9" fill="#E3CCAA"/>
      <path d="M195 470 C250 470 272 530 272 585 C272 630 240 652 195 652 C150 652 118 630 118 585 C118 530 140 470 195 470 Z" fill="#F6E7CF"/>
      <circle cx="155" cy="584" r="10" fill="#F2A7A0" opacity=".7"/><circle cx="235" cy="584" r="10" fill="#F2A7A0" opacity=".7"/>
      <g class="ex ex-idle"><g class="blink"><ellipse cx="172" cy="555" rx="8" ry="11" fill="#2B2340"/><ellipse cx="218" cy="555" rx="8" ry="11" fill="#2B2340"/><circle cx="175" cy="551" r="2.6" fill="#fff"/><circle cx="221" cy="551" r="2.6" fill="#fff"/></g><path d="M185 585 Q195 594 205 585" fill="none" stroke="#2B2340" stroke-width="3" stroke-linecap="round"/></g>
      <g class="ex ex-listening"><g class="blink"><ellipse cx="172" cy="553" rx="9.5" ry="13" fill="#2B2340"/><ellipse cx="218" cy="553" rx="9.5" ry="13" fill="#2B2340"/><circle cx="176" cy="548" r="3" fill="#fff"/><circle cx="222" cy="548" r="3" fill="#fff"/></g><ellipse cx="195" cy="588" rx="5" ry="6" fill="#2B2340"/><path class="arc" d="M286 520 Q300 545 286 570" fill="none" stroke="#FFD48A" stroke-width="3" stroke-linecap="round"/><path class="arc" style="animation-delay:.3s" d="M300 505 Q322 545 300 585" fill="none" stroke="#FFD48A" stroke-width="3" stroke-linecap="round" opacity=".6"/></g>
      <g class="ex ex-thinking"><ellipse cx="174" cy="549" rx="8" ry="10" fill="#2B2340"/><ellipse cx="220" cy="549" rx="8" ry="10" fill="#2B2340"/><circle cx="177" cy="544" r="2.6" fill="#fff"/><circle cx="223" cy="544" r="2.6" fill="#fff"/><path d="M188 588 Q195 584 202 588" fill="none" stroke="#2B2340" stroke-width="3" stroke-linecap="round"/><g class="think-dots" fill="#FFD48A"><circle cx="250" cy="480" r="4"/><circle cx="264" cy="466" r="5"/><circle cx="282" cy="450" r="6"/></g></g>
      <g class="ex ex-speaking"><g class="blink"><ellipse cx="172" cy="555" rx="8" ry="11" fill="#2B2340"/><ellipse cx="218" cy="555" rx="8" ry="11" fill="#2B2340"/><circle cx="175" cy="551" r="2.6" fill="#fff"/><circle cx="221" cy="551" r="2.6" fill="#fff"/></g><ellipse class="talk" cx="195" cy="588" rx="8" ry="6" fill="#2B2340"/></g>
      <g class="ex ex-approval"><ellipse cx="172" cy="559" rx="8" ry="10" fill="#2B2340"/><ellipse cx="218" cy="559" rx="8" ry="10" fill="#2B2340"/><circle cx="174" cy="563" r="2.4" fill="#fff"/><circle cx="220" cy="563" r="2.4" fill="#fff"/><path d="M162 536 L180 532" stroke="#2B2340" stroke-width="3" stroke-linecap="round"/><path d="M210 532 L228 536" stroke="#2B2340" stroke-width="3" stroke-linecap="round"/><path d="M187 588 L203 588" stroke="#2B2340" stroke-width="3" stroke-linecap="round"/></g>
      <g class="ex ex-happy"><path d="M163 556 Q172 545 181 556" fill="none" stroke="#2B2340" stroke-width="3.5" stroke-linecap="round"/><path d="M209 556 Q218 545 227 556" fill="none" stroke="#2B2340" stroke-width="3.5" stroke-linecap="round"/><path d="M182 582 Q195 598 208 582" fill="#2B2340"/></g>
    </g>
  </svg>
<div class="orbs" id="orbs" role="img" aria-label="No goals yet"></div>
<div class="bar"><button class="mic" id="mic" type="button" aria-label="Talk to Luma">
 <svg class="ic-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/></svg>
 <svg class="ic-wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="10" x2="5" y2="14"/><line x1="9" y1="7" x2="9" y2="17"/><line x1="13" y1="4" x2="13" y2="20"/><line x1="17" y1="8" x2="17" y2="16"/><line x1="21" y1="11" x2="21" y2="13"/></svg>
</button></div>
<p class="sr" id="said" aria-live="polite"></p>
</div>
</div>
<script>
const API="https://second-brain-xrtq.netlify.app/api/luma";
const $=id=>document.getElementById(id);
const phone=$("phone");
const KEY="luma-voice-v1";
let S={goals:[],tasks:[]},history=[],pending=null,greeted=false,busy=false,listening=false,autoListens=0;

/* ---------- fit ---------- */
function fit(){if(innerWidth<=600)return;document.documentElement.style.setProperty("--fit",Math.min(1,(innerHeight-32)/844,(innerWidth-32)/390));}
addEventListener("resize",fit);fit();

/* ---------- state ---------- */
try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(d&&Array.isArray(d.goals))S=d;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}renderOrbs();}
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY=()=>iso(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d);};
function renderOrbs(){const o=$("orbs");o.textContent="";const g=S.goals[S.goals.length-1];
 if(pending){pending.sessions.forEach(()=>{const i=document.createElement("i");i.className="pending";o.append(i);});o.setAttribute("aria-label","A plan is waiting for your yes");return;}
 if(!g){o.setAttribute("aria-label","No goals yet");return;}
 const ts=S.tasks.filter(t=>t.goalId===g.id);ts.forEach(t=>{const i=document.createElement("i");if(t.done)i.className="done";o.append(i);});
 o.setAttribute("aria-label",g.title+": "+ts.filter(t=>t.done).length+" of "+ts.length+" sessions done");}
renderOrbs();

/* ---------- character ---------- */
function mood(m){phone.dataset.mood=m;$("luma").setAttribute("aria-label","Luma is "+({idle:"waiting",listening:"listening",thinking:"thinking",speaking:"speaking",approval:"waiting for your yes",happy:"happy"}[m]||m));}
mood("idle");

/* ---------- voice out ---------- */
let voice=null;
function pickVoice(){const vs=("speechSynthesis" in window)?speechSynthesis.getVoices():[];
 voice=vs.find(v=>/^en/i.test(v.lang)&&/samantha|google us english|aria|jenny|zira|karen|moira|female/i.test(v.name))||vs.find(v=>/^en-(CA|US|GB)/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text){$("said").textContent=text;return new Promise(res=>{
 if(!("speechSynthesis" in window)){res();return;}
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-CA";u.rate=1.03;u.pitch=1.12;if(voice)u.voice=voice;
  let done=false;const fin=()=>{if(done)return;done=true;clearInterval(keep);res();};
  u.onend=u.onerror=fin;mood("speaking");speechSynthesis.speak(u);
  /* Chrome stops long utterances after ~15s unless nudged */
  const keep=setInterval(()=>{if(!speechSynthesis.speaking){fin();}else{speechSynthesis.pause();speechSynthesis.resume();}},10000);
  setTimeout(fin,Math.max(4000,text.split(" ").length*600));
 }catch(e){res();}});}

/* ---------- voice in ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function listen(){return new Promise(res=>{
 if(!SR){res(null);return;}
 let finalText="",interim="",ended=false;
 rec=new SR();rec.lang="en-CA";rec.interimResults=true;rec.continuous=false;
 rec.onresult=e=>{interim="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)finalText+=" "+r[0].transcript;else interim+=r[0].transcript;}};
 rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed")finalText="__denied__";};
 rec.onend=()=>{if(ended)return;ended=true;listening=false;res((finalText+" "+interim).trim()||null);};
 try{listening=true;mood("listening");rec.start();}catch(e){listening=false;res(null);}});}

/* ---------- agent ---------- */
function stateForAgent(){return {goals:S.goals.map(g=>({id:g.id,person:g.person,title:g.title,focus:g.focus})),
 open_tasks:S.tasks.filter(t=>!t.done).slice(0,10).map(t=>({id:t.id,goal_id:t.goalId,title:t.title,date:t.date})),
 done_tasks:S.tasks.filter(t=>t.done).length};}
async function askAgent(text){
 const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),11000);
 try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},signal:ctl.signal,
   body:JSON.stringify({message:text,history:history.slice(-8),state:stateForAgent(),pending:pending&&{goal:pending.goal,sessions:pending.sessions},today:TODAY()})});
  clearTimeout(to);const j=await r.json().catch(()=>null);
  if(r.ok&&j&&j.say)return j;
  return null;}
 catch(e){clearTimeout(to);return null;}}

/* rules used only when the agent is unreachable */
function offline(text){const l=text.toLowerCase();const yes=/^(yes|yeah|yep|sure|ok|okay|please|go ahead|do it|add them|sounds good)\b/.test(l.trim());
 if(pending&&yes)return {say:"Done. The first session is today. I'll check in after.",mood:"happy",action:{type:"confirm_plan"}};
 if(pending&&/^(no|not now|nope|cancel)\b/.test(l.trim()))return {say:"No problem, I won't save it.",mood:"idle",action:{type:"cancel_plan"}};
 if(/finished|done|completed/.test(l)){const t=S.tasks.find(x=>!x.done);if(t)return {say:"Nice work. I've ticked off "+t.title+".",mood:"happy",action:{type:"complete_tasks",task_ids:[t.id]}};}
 if(/french|exam|study|prepare|practi[cs]e/.test(l)){const lis=/listen/.test(l);const m=/1\.5|90|hour and a half|one and a half/.test(l)?90:60;
  return {say:"Got it, French exam prep for your wife"+(lis?", listening first":"")+". I'd plan five "+m+" minute sessions, starting tonight. Shall I add them as tasks?",mood:"approval",
   action:{type:"propose_plan",goal:{person:"wife",title:"French exam prep",focus:lis?"listening":"",minutes_per_day:m},sessions:[0,1,2,3,4].map(i=>({date:addDays(i),title:(lis?"Listening session ":"Session ")+(i+1),minutes:m}))}};}
 if(/swim/.test(l))return {say:"Swimming is Saturday from 10 to 11. Want a reminder to pack the blue bag on Friday night?",mood:"idle",action:{type:"none"}};
 if(/^(hi|hello|hey)\b/.test(l.trim()))return {say:"Hi! What's the family working on this week?",mood:"happy",action:{type:"none"}};
 return {say:"I'm having trouble thinking right now. Could you try that again in a moment?",mood:"idle",action:{type:"none"}};}

function apply(a){if(!a||!a.type)return;
 if(a.type==="propose_plan"&&a.sessions&&a.sessions.length){pending={goal:a.goal,sessions:a.sessions.map((s,i)=>({...s,date:s.date||addDays(i)}))};}
 else if(a.type==="confirm_plan"&&pending){const gid="g"+Date.now().toString(36);const g=pending.goal||{};
  S.goals.push({id:gid,person:g.person||"family",title:g.title||"Goal",focus:g.focus||"",minutes:g.minutes_per_day||null});
  pending.sessions.forEach((s,i)=>S.tasks.push({id:gid+"-"+(i+1),goalId:gid,title:s.title,date:s.date,minutes:s.minutes,done:false}));pending=null;save();}
 else if(a.type==="cancel_plan"){pending=null;}
 else if(a.type==="complete_tasks"){(a.task_ids||[]).forEach(id=>{const t=S.tasks.find(x=>x.id===id);if(t)t.done=true;});save();}
 else if(a.type==="add_task"){S.tasks.push({id:"t"+Date.now().toString(36),goalId:null,title:a.title,date:a.date||TODAY(),done:false});save();}
 renderOrbs();}

async function turn(text){
 busy=true;mood("thinking");history.push({role:"user",text});
 let r=await askAgent(text);if(!r)r=offline(text);
 apply(r.action);history.push({role:"luma",text:r.say});
 await speak(r.say);
 mood(pending?"approval":(r.mood==="happy"?"happy":"idle"));busy=false;
 if(r.mood==="happy")setTimeout(()=>{if(!busy&&!listening&&phone.dataset.mood==="happy")mood("idle");},2500);
 /* keep the conversation going hands-free when Luma asks something */
 if(SR&&/\?\s*$/.test(r.say)&&autoListens<4){autoListens++;await converse();}else autoListens=0;}

async function converse(){const heard=await listen();
 if(heard==="__denied__"){mood("idle");await speak("I need microphone access to hear you. Please allow the mic and tap me again.");mood("idle");return;}
 if(!heard){mood(pending?"approval":"idle");autoListens=0;return;}
 await turn(heard);}

$("mic").onclick=async()=>{
 if(listening){try{rec&&rec.stop();}catch(e){}return;}
 if(phone.dataset.mood==="speaking"){try{speechSynthesis.cancel();}catch(e){}}
 if(busy&&phone.dataset.mood==="thinking")return;
 autoListens=0;
 if(!SR){await speak("Voice input needs Chrome, Edge or Safari. Open this page there and talk to me.");mood("idle");return;}
 if(!greeted){greeted=true;busy=true;const open=S.tasks.filter(t=>!t.done);
  await speak(open.length?"Welcome back! You have "+open.length+" session"+(open.length>1?"s":"")+" left. What's new?":"Hi, I'm Luma. Tell me what the family is working on.");busy=false;}
 await converse();};
</script>
</body>
</html>
